name: Publicar desafios diários

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 06:00 UTC (03:00 em Brasília)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      # mantém um estoque de 14 dias à frente; nunca sobrescreve dias já publicados
      - run: npm run publish:daily -- --days 14
      - name: Commit e deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain public/daily)" ]; then
            git config user.name "cripto-plus-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/daily
            git commit -m "Publica desafios diários"
            git push
            gh workflow run pages.yml
          else
            echo "Nada novo para publicar."
          fi
